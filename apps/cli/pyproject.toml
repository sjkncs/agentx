[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "df-cli"
version = "0.1.0"
description = "Command-line interface for AgentX — orchestrate notebooks, dashboards, and runs from any terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentX Team" }]

dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "platformdirs>=4.2,<5",
    "keyring>=24,<26",
    "PyYAML>=6.0,<7",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-mock>=3.14,<4",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-PyYAML",
]

[project.scripts]
df = "df_cli.app:main"
df-cli = "df_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/df_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true