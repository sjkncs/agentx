# GitHub Pages deploy for the DataFoundry marketing site.
#
# The marketing site lives in apps/marketing (a standalone Next.js 15.5
# project) because the main apps/web app mixes marketing routes with
# runtime API routes and dynamic admin pages — Next.js refuses to bundle
# those under `output: "export"`. apps/marketing is a trimmed fork with
# no API dependencies, so it produces a static bundle this workflow can
# upload.
#
# Trigger: push to main, OR manual dispatch from the Actions tab.
#
# What it does:
#   1. npm install (workspace via npm workspaces; package-lock.json is
#      out of sync with the new apps/marketing workspace, so we use
#      `npm install` rather than `npm ci` to reconcile)
#   2. Build apps/marketing with AGENTX_PAGES=1 → output: "export" →
#      static .next/server/app/ (HTML) and .next/static/ (JS/CSS)
#   3. Reorganise the build into .artifact/agentx/ so every link
#      (/features, /_next/static/...) resolves at
#      https://sjkncs.github.io/agentx/ — Next.js 15 does NOT
#      automatically apply basePath to output:export HTML hrefs, so
#      we copy into a project-site-prefixed subdirectory manually.
#   4. Upload .artifact/agentx as the GitHub Pages artifact
#   5. Deploy via actions/deploy-pages@v4 to the github-pages environment
#
# Required repo setup:
#   - GitHub repo: <owner>/agentx (project Pages site)
#   - Settings → Pages → Source: "GitHub Actions"
#   - The first successful run auto-creates the Pages environment;
#     no extra secrets needed beyond the default GITHUB_TOKEN.
#
# Why this artifact layout (manual /agentx/ prefix):
#   GitHub Pages URLs are https://<owner>.github.io/<repo>/ so the static
#   bundle needs /agentx prefix on every internal link and _next asset.
#   Setting `basePath: "/agentx"` in next.config.ts works for the dev
#   server but Next.js 15's `output: "export"` keeps the un-prefixed
#   paths in the HTML, so we copy the build into `.artifact/agentx/`
#   and upload that.

name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "apps/web/src/app/(marketing)/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow only one concurrent deployment, queueing newer runs and
# cancelling in-progress ones from the same ref. Avoids racing the
# Pages deploy lock when multiple commits land in quick succession.
concurrency:
  group: pages
  cancel-in-progress: true

# Restrict default token to minimum required permissions.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) — package-lock.json is out of
        # sync with package.json (new workspaces and dependencies have
        # been added since the lockfile was last regenerated). `npm
        # install` reconciles both on each run.
        run: npm install

      - name: Build marketing site
        working-directory: apps/marketing
        env:
          AGENTX_PAGES: "1"
        run: npm run build

      - name: Organize artifact under /agentx prefix
        # Layout goal: <artifact>/index.html, <artifact>/features/index.html,
        #              <artifact>/_next/static/..., <artifact>/brand/...
        # URL:  https://sjkncs.github.io/agentx/            → agentx/index.html
        #       https://sjkncs.github.io/agentx/features/   → agentx/features/index.html
        #
        # Next.js 15.5 with basePath: "/agentx" + trailingSlash: true emits
        # HTML <a href="/agentx/features/"> in the bundle, so we must put
        # each page at <artifact>/<name>/index.html so GitHub Pages resolves
        # the trailing-slash URL.
        run: |
          mkdir -p .artifact/agentx/_next/static
          cp -r apps/marketing/.next/static/. .artifact/agentx/_next/static/
          cp -r apps/marketing/public/. .artifact/agentx/ 2>/dev/null || true
          # Root index.html: app/index.html → agentx/index.html
          cp apps/marketing/.next/server/app/index.html .artifact/agentx/index.html
          # Each named page: app/<name>.html → agentx/<name>/index.html
          for f in apps/marketing/.next/server/app/*.html; do
            name=$(basename "$f" .html)
            [ "$name" = "index" ] && continue
            [ "$name" = "_not-found" ] && continue
            mkdir -p ".artifact/agentx/$name"
            cp "$f" ".artifact/agentx/$name/index.html"
          done
          # 404 fallback at root
          cp apps/marketing/.next/server/app/_not-found.html .artifact/agentx/404.html 2>/dev/null || true

      - name: Setup Pages artifact
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .artifact/agentx

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
