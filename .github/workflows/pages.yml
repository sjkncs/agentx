# GitHub Pages deploy for the DataFoundry marketing site.
#
# The marketing site lives in apps/marketing (a standalone Next.js 15.5
# project) because the main apps/web app mixes marketing routes with
# runtime API routes and dynamic admin pages — Next.js refuses to bundle
# those under `output: "export"`. apps/marketing is a trimmed fork with
# no API dependencies, so it produces a static bundle this workflow can
# upload.
#
# Trigger: push to main, OR manual dispatch from the Actions tab.
#
# What it does:
#   1. npm install (workspace via npm workspaces; package-lock.json is
#      out of sync with the new apps/marketing workspace, so we use
#      `npm install` rather than `npm ci` to reconcile)
#   2. Build apps/marketing with AGENTX_PAGES=1 → output: "export" →
#      apps/marketing/out/: a finished static site with folder-style
#      pages (features/index.html), 404.html, and _next/ assets
#   3. Upload apps/marketing/out directly as the GitHub Pages artifact
#   4. Deploy via actions/deploy-pages@v4 to the github-pages environment
#
# Required repo setup:
#   - GitHub repo: <owner>/agentx (project Pages site)
#   - Settings → Pages → Source: "GitHub Actions"
#   - The first successful run auto-creates the Pages environment;
#     no extra secrets needed beyond the default GITHUB_TOKEN.
#
# Why no manual reorganisation:
#   AGENTX_PAGES=1 sets `basePath: "/agentx"` and `trailingSlash: true`
#   in apps/marketing/next.config.ts. next/link and the asset URLs in
#   the exported HTML both honor basePath, so every href/src is already
#   /agentx-prefixed in out/. trailingSlash makes the export emit
#   folder-style pages (features/index.html), which GitHub Pages needs
#   to serve trailing-slash URLs — a flat features.html 404s at
#   /agentx/features/. GitHub Pages serves the artifact root at
#   https://<owner>.github.io/<repo>/, so out/ uploads as-is.

name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "apps/web/src/app/(marketing)/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow only one concurrent deployment, queueing newer runs and
# cancelling in-progress ones from the same ref. Avoids racing the
# Pages deploy lock when multiple commits land in quick succession.
concurrency:
  group: pages
  cancel-in-progress: true

# Restrict default token to minimum required permissions.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) — package-lock.json is out of
        # sync with package.json (new workspaces and dependencies have
        # been added since the lockfile was last regenerated). `npm
        # install` reconciles both on each run.
        run: npm install

      - name: Build marketing site
        working-directory: apps/marketing
        env:
          AGENTX_PAGES: "1"
        run: npm run build

      - name: Setup Pages artifact
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # out/ is the finished export: folder-style pages, 404.html,
          # _next/ assets, public/ files — all hrefs already /agentx-prefixed.
          path: apps/marketing/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
