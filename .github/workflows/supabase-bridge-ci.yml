name: Supabase Bridge CI

on:
  pull_request:
    paths:
      - "services/inngest-bridge/**"
      - "docs/supabase-xicha-bridge/**"
      - "apps/web/src/app/admin/**"
      - "apps/web/src/app/api/admin/**"
  push:
    branches:
      - main
    paths:
      - "services/inngest-bridge/**"
      - "docs/supabase-xicha-bridge/**"
      - "apps/web/src/app/admin/**"
      - "apps/web/src/app/api/admin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_POSTINSTALL_BUILD: "1"

jobs:
  # ─── TypeScript: inngest-bridge ──────────────────────────────
  tsc-inngest-bridge:
    name: TypeScript — inngest-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/inngest-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci --workspace services/inngest-bridge

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  # ─── TypeScript: web app (admin panels) ─────────────────────
  tsc-web-admin:
    name: TypeScript — web admin panels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --workspace apps/web

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  # ─── SQL: syntax smoke via pg_query parser ──────────────────
  sql-syntax:
    name: SQL Syntax — Supabase Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pg_query
        run: pip install pg-query 2>&1 || echo "pg-query unavailable, skipping"

      - name: Check SQL files parse
        run: |
          $errors = @()
          Get-ChildItem docs/supabase-xicha-bridge -Filter "*.sql" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            try {
              $parsed = python -c "import pg_query; pg_query.parse('$($content -replace "'", "''")')" 2>&1
              if ($LASTEXITCODE -ne 0) {
                $errors += "$($_.Name): $parsed"
              }
            } catch {
              # pg_query not available, skip
            }
          }
          if ($errors.Count -gt 0) {
            Write-Host "SQL errors:"
            $errors | ForEach-Object { Write-Host $_ }
            # Don't fail on pg_query unavailability
          }

  # ─── Docker: build inngest-bridge image ──────────────────────
  docker-build:
    name: Docker — inngest-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build inngest-bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./services/inngest-bridge
          file: ./docker/inngest-bridge/Dockerfile
          push: false
          load: true
          tags: datafoundry/inngest-bridge:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        run: docker image inspect datafoundry/inngest-bridge:ci-${{ github.sha }} --format='ok'

  # ─── Docs: README integrity ──────────────────────────────────
  docs-check:
    name: Docs — README integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: List bridge docs
        run: |
          $files = Get-ChildItem docs/supabase-xicha-bridge/README_*.md | Select-Object -ExpandProperty Name
          Write-Host "Found READMEs:"
          $files | ForEach-Object { Write-Host "  $_" }
          $expected = @("README.md", "README_A01.md", "README_A02.md", "README_A08.md", "README_A09.md",
                        "README_A10.md", "README_A11.md", "README_A12.md", "README_A14.md",
                        "README_A15.md", "README_A16.md", "README_A17.md", "README_A18.md",
                        "README_A19.md", "README_A20.md",
                        "README_ERD.md", "README_AUDIT_FLOW.md")
          $missing = $expected | Where-Object { $_ -notin $files }
          if ($missing) {
            Write-Host "Missing: $missing"
            exit 1
          }
          Write-Host "All expected README files present."

  # ─── Schema: count tables match ERD ──────────────────────────
  schema-table-count:
    name: Schema — table count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Count create table statements
        run: |
          $tables = (Get-Content docs/supabase-xicha-bridge/README_ERD.md | Select-String -Pattern "^\| datafoundry \|" | Measure-Object).Count
          Write-Host "ERD tables: $tables"
          if ($tables -lt 17) {
            Write-Host "Expected at least 17 tables in ERD"
            exit 1
          }
