version: "3.9"

# datafoundry-enhanced/services/docker-compose.yml
# 启动：docker compose -f services/docker-compose.yml --env-file .env up -d inngest-bridge
#
# .env 需包含：
#   SUPABASE_URL=https://xxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY=eyJ...
#   INNGEST_EVENT_API_BASE=http://inngest:8288  （可选；空 = 走 dry-run 风控）
#   DISPATCHED_TO=worker
#   DINGTALK_BASE_URL=https://oapi.dingtalk.com

services:
  inngest-bridge:
    build:
      context: ..
      dockerfile: docker/inngest-bridge/Dockerfile
    image: datafoundry/inngest-bridge:latest
    container_name: df-inngest-bridge
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      INNGEST_EVENT_API_BASE: ${INNGEST_EVENT_API_BASE:-}
      DINGTALK_BASE_URL: ${DINGTALK_BASE_URL:-https://oapi.dingtalk.com}
      DISPATCHED_TO: ${DISPATCHED_TO:-worker}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-800}
      BATCH_SIZE: ${BATCH_SIZE:-5}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-5000}
      DRY_RUN: ${DRY_RUN:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 未来挂 Inngest 本体（生产用 Inngest Cloud）
  inngest:
    image: inngest/inngest:latest
    container_name: df-inngest
    profiles: ["with-inngest"]
    command: ["inngest", "dev", "-u", "http://host.docker.internal:3000/api/inngest"]
    ports:
      - "8288:8288"
