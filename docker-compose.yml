# ============================================================
# docker-compose.yml — A20.1 Local Development Stack
#
# 启动顺序：
#   docker compose up -d postgres redis
#   sleep 5
#   docker compose run --rm db-init
#   docker compose up -d
#
# 端口：
#   :5432  Postgres
#   :6379  Redis (reserved)
#   :8787  API  (via npm run dev:api on host)
#   :3000  Web  (via npm run dev:web on host)
# ============================================================

services:
  # ─── Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       agentx
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentx"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis (reserved) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── DB Init (run-once via docker compose run) ──────────────
  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docs/services/supabase-integration:/sql
    command: >
      sh -c "
        for f in 001_init.sql 002_schema.sql 003_rpcs.sql 004_seeds.sql; do
          echo '--- applying: '$$f;
          psql -h postgres -U postgres -d agentx -f /sql/$$f || true;
        done;
        echo 'DB init done'
      "
    networks:
      - backend

  # ─── Inngest Bridge Subscriber (subscribe_loop) ────────────
  # 持续 poll fsf_inngest_events → 匹配订阅 → 投递 enterprise IM / webhook
  inngest-bridge-subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SUPABASE_URL:           http://host.docker.internal:5432
      SUPABASE_SERVICE_ROLE_KEY: postgres
      DISPATCHED_TO:           subscriber
      SUBSCRIBER_WORKSPACE_ID: default
      POLL_INTERVAL_MS:        ${POLL_INTERVAL_MS:-1000}
      BATCH_SIZE:              ${BATCH_SIZE:-5}
      HTTP_TIMEOUT_MS:         ${HTTP_TIMEOUT_MS:-5000}
      DRY_RUN:                 ${DRY_RUN:-false}
      DINGTALK_ROBOT_SECRET:   ${DINGTALK_ROBOT_SECRET:-}
      DINGTALK_APP_KEY:        ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET:     ${DINGTALK_APP_SECRET:-}
      RETRY_MULTIPLIER:        ${RETRY_MULTIPLIER:-2.0}
      RETRY_MAX_DELAY:         ${RETRY_MAX_DELAY:-3600}
      RETRY_MAX_DINGTALK:      ${RETRY_MAX_DINGTALK:-5}
      RETRY_BASE_DINGTALK:     ${RETRY_BASE_DINGTALK:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9229/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  # ─── Inngest Bridge Verifier (verify-loop) ─────────────────
  # 每 VERIFY_INTERVAL_MS 查询 fsf_work_orders.sla_deadline，超时更新 sla_status
  inngest-bridge-verify:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SUPABASE_URL:            http://host.docker.internal:5432
      SUPABASE_SERVICE_ROLE_KEY: postgres
      DISPATCHED_TO:            verifier
      VERIFY_INTERVAL_MS:       ${VERIFY_INTERVAL_MS:-30000}
      HTTP_TIMEOUT_MS:          ${HTTP_TIMEOUT_MS:-5000}
      DRY_RUN:                  ${DRY_RUN:-false}
      DINGTALK_ROBOT_SECRET:    ${DINGTALK_ROBOT_SECRET:-}
      DINGTALK_APP_KEY:         ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET:       ${DINGTALK_APP_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
